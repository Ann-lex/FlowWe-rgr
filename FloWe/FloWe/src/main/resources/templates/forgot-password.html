<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля | FloWe</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page">
    <h1>Восстановление пароля</h1>

    <p>
        Введите email, указанный при регистрации. Мы отправим ссылку для создания нового пароля.
    </p>

    <p class="alert" th:if="${message}" th:text="${message}"></p>
    <p class="alert error" th:if="${error}" th:text="${error}"></p>

    <form class="form" th:action="@{/forgot-password}" method="post">
        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="form-row">
            <label for="email">Email</label>
            <input id="email"
                   type="email"
                   name="email"
                   required>
        </div>

        <button class="btn primary" type="submit">Отправить письмо</button>
    </form>

    <p>
        <a th:href="@{/login}">Вернуться ко входу</a>
    </p>
</main>

</body>
</html>
