<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Кабинет продавца | FloWe</title>
</head>
<body>

<div>
    <a href="/">Главная</a>
    |
    <a href="/products">Каталог товаров</a>
</div>

<hr>

<h1>Кабинет продавца</h1>

<p>
    <b>Продавец:</b>
    <span th:text="${sellerName}">Имя продавца</span>
</p>

<p>
    <b>Количество товаров:</b>
    <span th:text="${productCount}">0</span>
</p>

<p>
    Здесь продавец может управлять своими товарами: добавлять, редактировать и удалять товары.
</p>

<p>
    <a href="/seller/products">Мои товары</a>
</p>

</body>
</html>
