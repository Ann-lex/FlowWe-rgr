<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Кабинет продавца | FloWe</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page">
    <div class="toolbar">
        <h1>Кабинет продавца</h1>

        <div class="top-actions">
            <a class="btn primary" th:href="@{/seller/products}">Мои товары</a>
            <a class="btn ghost" th:href="@{/seller/stock-history}">История склада</a>
        </div>
    </div>

    <section class="grid three">
        <article class="card">
            <h3>Продавец</h3>
            <p th:text="${sellerName}">Имя продавца</p>
        </article>

        <article class="card">
            <h3>Товаров добавлено</h3>
            <p th:text="${productCount}">0</p>
        </article>

        <article class="card">
            <h3>Управление</h3>
            <p>Добавляйте, редактируйте и удаляйте товары, контролируйте цену и остатки.</p>
        </article>
    </section>
</main>

</body>
</html>
