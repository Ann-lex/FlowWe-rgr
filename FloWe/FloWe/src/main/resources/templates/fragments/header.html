<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header class="site-header" th:fragment="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}">FloWe</a>

        <nav class="nav">
            <a th:href="@{/}">Главная</a>
            <a th:href="@{/products}">Каталог</a>

            <a th:href="@{/cart}" sec:authorize="hasRole('BUYER')">Корзина</a>
            <a th:href="@{/favorites}" sec:authorize="hasRole('BUYER')">Избранное</a>

            <a th:href="@{/seller}" sec:authorize="hasRole('SELLER')">Продавец</a>
            <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Админ</a>

            <a th:href="@{/profile}" sec:authorize="isAuthenticated()">Профиль</a>
        </nav>

        <div class="header-actions">
            <span class="user-email" sec:authorize="isAuthenticated()">
                <span sec:authentication="name"></span>
            </span>

            <a class="btn btn-light" th:href="@{/login}" sec:authorize="!isAuthenticated()">Войти</a>
            <a class="btn btn-primary" th:href="@{/register}" sec:authorize="!isAuthenticated()">Регистрация</a>

            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button class="btn btn-light" type="submit">Выйти</button>
            </form>
        </div>
    </div>
</header>

</body>
</html>
