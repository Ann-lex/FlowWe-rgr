<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Профиль | FloWe</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page role-page buyer-page">
    <section class="role-hero">
        <div>
            <p class="eyebrow">Кабинет покупателя</p>
            <h1 th:text="${user.firstName} + ' ' + ${user.lastName}">Покупатель</h1>
            <p th:text="${user.email}">email@example.com</p>
        </div>
        <strong th:text="${user.balance} + ' ₽'">0 ₽</strong>
    </section>

    <section class="role-grid">
        <a class="role-card" th:href="@{/products}">Каталог</a>
        <a class="role-card" th:href="@{/cart}">Корзина</a>
        <a class="role-card" th:href="@{/favorites}">Избранное</a>
        <a class="role-card" th:href="@{/orders}">Мои заказы</a>
        <a class="role-card" th:href="@{/profile/payments}">Мои оплаты</a>
    </section>

    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn primary" type="submit">Выйти</button>
    </form>
</main>

</body>
</html>
