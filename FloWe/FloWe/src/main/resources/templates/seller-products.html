<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мои товары | FloWe</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page">
    <div class="toolbar">
        <h1>Мои товары</h1>
        <a class="btn primary" th:href="@{/seller/products/add}">Добавить товар</a>
    </div>

    <p class="alert error" th:if="${error}" th:text="${error}"></p>

    <p class="empty" th:if="${products == null or products.isEmpty()}">
        У вас пока нет добавленных товаров.
    </p>

    <table class="table" th:if="${products != null and !products.isEmpty()}">
        <thead>
        <tr>
            <th>Название</th>
            <th>Цена</th>
            <th>Количество</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.name}">Название</td>
            <td th:text="${product.price} + ' ₽'">0 ₽</td>
            <td th:text="${product.quantity}">0</td>
            <td>
                <div class="actions">
                    <a class="btn ghost" th:href="@{/products/{id}(id=${product.id})}">Открыть</a>
                    <a class="btn ghost" th:href="@{/seller/products/edit/{id}(id=${product.id})}">Изменить</a>

                    <form th:action="@{/seller/products/delete/{id}(id=${product.id})}"
                          method="post"
                          data-confirm="Удалить этот товар?">
                        <button class="btn ghost" type="submit">Удалить</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
