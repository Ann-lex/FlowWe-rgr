<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Избранное | FloWe</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page">
    <h1>Избранное</h1>

    <p class="empty" th:if="${favorites == null or favorites.isEmpty()}">
        В избранном пока нет товаров.
    </p>

    <div class="grid products" th:if="${favorites != null and !favorites.isEmpty()}">
        <article class="product" th:each="item : ${favorites}">
            <img th:if="${item.imageUrl != null and !item.imageUrl.isBlank()}"
                 th:src="${item.imageUrl}"
                 alt="Фото товара">

            <div class="product-body">
                <h3>
                    <a th:href="@{/products/{id}(id=${item.productId})}"
                       th:text="${item.productName}">
                        Товар
                    </a>
                </h3>

                <p th:text="${item.description}">Описание</p>
                <strong th:text="${item.price} + ' ₽'">0 ₽</strong>

                <form th:action="@{/favorites/items/{id}/access(id=${item.productId})}" method="post">
                    <label>Доступ</label>
                    <select name="accessLevel">
                        <option value="PRIVATE" th:selected="${item.accessLevel == 'PRIVATE'}">Только мне</option>
                        <option value="LINK" th:selected="${item.accessLevel == 'LINK'}">По ссылке</option>
                        <option value="PUBLIC" th:selected="${item.accessLevel == 'PUBLIC'}">Публично</option>
                    </select>

                    <button class="btn ghost" type="submit">Сохранить</button>
                </form>

                <div class="actions">
                    <form th:action="@{/cart/items}" method="post">
                        <input type="hidden" name="productId" th:value="${item.productId}">
                        <button class="btn primary" type="submit">В корзину</button>
                    </form>

                    <form th:action="@{/favorites/items/{id}/delete(id=${item.productId})}"
                          method="post"
                          data-confirm="Удалить товар из избранного?">
                        <button class="btn ghost" type="submit">Удалить</button>
                    </form>
                </div>
            </div>
        </article>
    </div>
</main>

</body>
</html>
