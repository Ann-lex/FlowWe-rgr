<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Каталог | FloWe</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page">
    <h1>Каталог</h1>

    <p class="alert error" th:if="${error}" th:text="${error}"></p>

    <section class="grid three" th:if="${showCategoriesOnly}">
        <a class="card link-card"
           th:each="category : ${categories}"
           th:href="@{/products(categoryId=${category.id})}">
            <h3 th:text="${category.name}">Категория</h3>
            <p>Посмотреть товары категории</p>
        </a>
    </section>

    <section th:if="${showCategoriesOnly == false}">
        <div class="toolbar">
            <h2 th:text="${selectedCategory.name}">Категория</h2>
            <a class="btn ghost" th:href="@{/products}">Все категории</a>
        </div>

        <form class="filters" th:action="@{/products}" method="get">
            <input type="hidden" name="categoryId" th:value="${selectedCategoryId}">
            <input type="text" name="keyword" placeholder="Название или описание" th:value="${keyword}">
            <input type="number" step="0.01" name="minPrice" placeholder="Цена от" th:value="${minPrice}">
            <input type="number" step="0.01" name="maxPrice" placeholder="Цена до" th:value="${maxPrice}">
            <button class="btn primary" type="submit">Найти</button>
        </form>

        <p class="empty" th:if="${products == null or products.isEmpty()}">
            Товары не найдены.
        </p>

        <div class="grid products">
            <article class="product" th:each="product : ${products}">
                <img th:if="${product.imageUrl != null and !product.imageUrl.isBlank()}"
                     th:src="${product.imageUrl}"
                     alt="Фото товара">

                <div class="product-body">
                    <h3>
                        <a th:href="@{/products/{id}(id=${product.id}, categoryId=${selectedCategoryId})}"
                           th:text="${product.name}">Товар</a>
                    </h3>

                    <p th:text="${product.description}">Описание</p>
                    <strong th:text="${product.price} + ' ₽'">0 ₽</strong>
                    <span th:text="'На складе: ' + ${product.quantity}">На складе: 0</span>

                    <div class="actions">
                        <a class="btn ghost"
                           th:href="@{/products/{id}(id=${product.id}, categoryId=${selectedCategoryId})}">
                            Подробнее
                        </a>

                        <form th:action="@{/cart/items}" method="post">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <button class="btn primary" type="submit">В корзину</button>
                        </form>
                    </div>
                </div>
            </article>
        </div>
    </section>
</main>

</body>
</html>
