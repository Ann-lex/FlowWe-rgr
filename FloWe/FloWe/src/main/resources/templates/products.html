<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Каталог | FloWe</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page">
    <h1>Каталог</h1>

    <p class="alert error" th:if="${error}" th:text="${error}"></p>

    <section class="category-showcase" th:if="${showCategoriesOnly}">
        <a class="category-tile bouquets"
           th:each="category : ${categories}"
           th:classappend="${#strings.containsIgnoreCase(category.name, 'раст') ? ' plants' : (#strings.containsIgnoreCase(category.name, 'цвет') ? ' flowers' : ' bouquets')}"
           th:href="@{/products(categoryId=${category.id})}">
            <span class="category-overlay"></span>
            <span class="category-content">
                <b th:text="${category.name}">Букеты</b>
                <small>Открыть ассортимент</small>
            </span>
        </a>
    </section>

    <section th:if="${showCategoriesOnly == false}">
        <div class="toolbar">
            <h2 th:text="${selectedCategory != null ? selectedCategory.name : 'Результаты поиска'}">
                Результаты поиска
            </h2>

            <a class="btn ghost" th:href="@{/products}">Все категории</a>
        </div>

        <form class="filters" th:action="@{/products}" method="get">
            <input type="hidden"
                   name="categoryId"
                   th:if="${selectedCategoryId != null}"
                   th:value="${selectedCategoryId}">

            <input type="text"
                   name="keyword"
                   placeholder="Название или описание"
                   th:value="${keyword}">

            <input type="number"
                   step="0.01"
                   name="minPrice"
                   placeholder="Цена от"
                   th:value="${minPrice}">

            <input type="number"
                   step="0.01"
                   name="maxPrice"
                   placeholder="Цена до"
                   th:value="${maxPrice}">

            <button class="btn primary" type="submit">Найти</button>
        </form>

        <p class="empty" th:if="${products == null or products.isEmpty()}">
            Товары не найдены.
        </p>

        <div class="grid products" th:if="${products != null and !products.isEmpty()}">
            <article class="product" th:each="product : ${products}">
                <img th:if="${product.imageUrl != null and !product.imageUrl.isBlank()}"
                     th:src="${product.imageUrl}"
                     alt="Фото товара">

                <div class="product-body">
                    <h3>
                        <a th:href="@{/products/{id}(id=${product.id}, categoryId=${selectedCategoryId})}"
                           th:text="${product.name}">
                            Товар
                        </a>
                    </h3>

                    <p th:text="${product.description}">Описание</p>

                    <strong th:text="${product.price} + ' ₽'">0 ₽</strong>

                    <span th:text="'На складе: ' + ${product.quantity}">
                        На складе: 0
                    </span>

                    <div class="actions">
                        <a class="btn ghost"
                           th:href="@{/products/{id}(id=${product.id}, categoryId=${selectedCategoryId})}">
                            Подробнее
                        </a>

                        <form sec:authorize="hasRole('BUYER')"
                              th:action="@{/cart/items}"
                              method="post">
                            <input type="hidden"
                                   th:if="${_csrf != null}"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <input type="hidden"
                                   name="productId"
                                   th:value="${product.id}">

                            <input type="number"
                                   name="quantity"
                                   value="1"
                                   min="1"
                                   th:max="${product.quantity}">

                            <button class="btn primary"
                                    type="submit"
                                    th:disabled="${product.quantity <= 0}">
                                В корзину
                            </button>
                        </form>

                        <span class="muted"
                              sec:authorize="hasRole('SELLER') or hasRole('ADMIN')">
                            Каталог доступен только для просмотра
                        </span>
                    </div>
                </div>
            </article>
        </div>
    </section>
</main>

</body>
</html>
