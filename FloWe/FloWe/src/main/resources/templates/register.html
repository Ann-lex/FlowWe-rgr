<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация | FloWe</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page">
    <h1>Регистрация</h1>

    <p class="alert error" th:if="${error}" th:text="${error}"></p>

    <form class="form" th:action="@{/register}" th:object="${registerRequest}" method="post">
        <div class="form-row">
            <label for="firstName">Имя</label>
            <input id="firstName" type="text" th:field="*{firstName}" required>
        </div>

        <div class="form-row">
            <label for="lastName">Фамилия</label>
            <input id="lastName" type="text" th:field="*{lastName}" required>
        </div>

        <div class="form-row">
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" required>
        </div>

        <div class="form-row">
            <label for="password">Пароль</label>
            <input id="password" type="password" th:field="*{password}" required>
        </div>

        <button class="btn primary" type="submit">Зарегистрироваться</button>
    </form>
</main>

</body>
</html>
