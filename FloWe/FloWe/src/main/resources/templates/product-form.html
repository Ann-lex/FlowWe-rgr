<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle} + ' | FloWe'">Форма товара | FloWe</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page">
    <div class="toolbar">
        <h1 th:text="${formTitle}">Форма товара</h1>
        <a class="btn ghost" th:href="@{/seller/products}">Назад к товарам</a>
    </div>

    <p class="alert error" th:if="${error}" th:text="${error}"></p>

    <form class="form"
          th:action="@{${formAction}}"
          th:object="${productForm}"
          method="post"
          enctype="multipart/form-data">

        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{imageUrl}">

        <div class="form-row">
            <label for="name">Название товара</label>
            <input id="name" type="text" th:field="*{name}" required>
        </div>

        <div class="form-row">
            <label for="description">Описание</label>
            <textarea id="description" th:field="*{description}" rows="4"></textarea>
        </div>

        <div class="form-row">
            <label for="price">Цена</label>
            <input id="price" type="number" step="0.01" min="0.01" th:field="*{price}" required>
        </div>

        <div class="form-row">
            <label for="quantity">Количество на складе</label>
            <input id="quantity" type="number" min="0" th:field="*{quantity}" required>
        </div>

        <div class="form-row">
            <label for="categoryId">Категория</label>
            <select id="categoryId" th:field="*{categoryId}" required>
                <option value="">Выберите категорию</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}">
                    Категория
                </option>
            </select>
        </div>

        <div class="form-row">
            <label for="imageFile">Изображение товара</label>
            <input id="imageFile" type="file" th:field="*{imageFile}" accept="image/*" data-image-input>
        </div>

        <div th:if="${productForm.imageUrl != null and !productForm.imageUrl.isBlank()}">
            <p><b>Текущее изображение:</b></p>
            <img th:src="${productForm.imageUrl}" alt="Фото товара" style="max-width:220px; border-radius:8px;">
        </div>

        <img data-image-preview hidden alt="Предпросмотр изображения" style="max-width:220px; border-radius:8px; margin-bottom:16px;">

        <button class="btn primary" type="submit">Сохранить</button>
    </form>
</main>

</body>
</html>
