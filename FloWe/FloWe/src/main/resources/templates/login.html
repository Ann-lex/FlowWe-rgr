<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход | FloWe</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page">

    <h1>Вход</h1>

    <p class="alert error" th:if="${param.error}">
        Неверный email или пароль.
    </p>

    <p class="alert" th:if="${param.logout}">
        Вы вышли из аккаунта.
    </p>

    <form class="form" th:action="@{/login}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="form-row">
            <label for="email">Email</label>
            <input id="email"
                   type="email"
                   name="email"
                   required>
        </div>

        <div class="form-row">
            <label for="password">Пароль</label>
            <input id="password"
                   type="password"
                   name="password"
                   required>
        </div>

        <button class="btn primary" type="submit">Войти</button>
    </form>

    <p>
        <a th:href="@{/forgot-password}">Забыли пароль?</a>
    </p>

    <p>
        <a th:href="@{/resend-verification}">Не пришло письмо подтверждения?</a>
    </p>

    <p>
        Нет аккаунта?
        <a th:href="@{/register}">Зарегистрироваться</a>
    </p>

</main>

</body>
</html>
